name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: 🧪 Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f FastAPI/requirements.txt ]; then pip install -r FastAPI/requirements.txt; fi

      - name: Check Syntax (Lint)
        run: |
          pip install flake8
          # Arrête le build s'il y a des erreurs de syntaxe Python
          flake8 FastAPI/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Ne compte que comme warning pour d'autres erreurs mineures
          flake8 FastAPI/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    name: 🐳 Build Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose Services
        run: |
          docker-compose build

  deploy:
    name: 🚀 Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Script
        run: |
          echo "🚀 Déploiement automatisé du projet MLOps..."
          echo "ℹ️ Note: Les commandes SSH ou d'application spécifiques (AWS, Heroku, VPS) doivent être insérées ici."
          # Exemple : ssh user@server "cd /path/to/project && git pull && docker-compose up -d --build"
          echo "✅ Déploiement terminé avec succès !"
