server:
  port: 8080

spring:
  application:
    name: gateway-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    gateway:
      routes:
        # Route vers le service d'Authentification (Le Gardien)
        - id: identity-service
          uri: ${GARDIEN_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

        # Route Admin vers Gardien (pour les profs)
        - id: admin-identity-service
          uri: ${GARDIEN_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/professors/**
          filters:
            - RewritePath=/api/admin/professors(?<segment>/?.*), /auth/professors$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

        # Route Admin vers Course Service (pour les stats)
        - id: admin-course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/dashboard/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

        # Route vers le service de Cours (Le Bibliothécaire)
        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/courses/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

        # Route vers l'Agent IA (Python FastAPI - à créer)
        - id: ai-assistant-service
          uri: ${AI_SERVICE_URL:http://localhost:5005}
          predicates:
            - Path=/api/ai/**

        # Route vers le Live Service (Sessions de cours)
        - id: live-service
          uri: ${LIVE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/livesession/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
